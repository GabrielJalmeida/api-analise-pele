name: Validar V4

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --basetemp .pytest-build-temp
      - run: python -m compileall -q main.py config.py models.py services.py routers tests

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        projeto: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ matrix.projeto }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
