name: Build Skin Admin para Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: admin/src-tauri -> target

      - name: Instalar dependências Python
        run: python -m pip install -r requirements-desktop.txt

      - name: Testar API
        run: python -m pytest -q

      - name: Empacotar API
        run: python -m PyInstaller --noconfirm --clean desktop_api.spec

      - name: Preparar sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force admin/src-tauri/binaries | Out-Null
          Copy-Item dist/lumina-api.exe admin/src-tauri/binaries/lumina-api-x86_64-pc-windows-msvc.exe

      - name: Instalar painel
        working-directory: admin
        run: npm ci

      - name: Instalar CLI do Tauri
        run: cargo install tauri-cli --locked

      - name: Gerar instalador
        working-directory: admin
        run: cargo tauri build --bundles nsis

      - name: Publicar artefatos do build
        uses: actions/upload-artifact@v6
        with:
          name: skin-admin-versao-x-windows
          if-no-files-found: error
          path: |
            admin/src-tauri/target/release/bundle/nsis/*.exe
            dist/lumina-api.exe
