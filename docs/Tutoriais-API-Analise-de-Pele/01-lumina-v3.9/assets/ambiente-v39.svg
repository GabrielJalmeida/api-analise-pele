<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Backend, frontend e painel rodando juntos</title>
  <desc id="desc">Ilustração de uma janela do VS Code com três terminais e uma janela do navegador.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#edf1e9"/><stop offset="1" stop-color="#e9dfd1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#172738" flood-opacity=".13"/></filter>
  </defs>
  <rect width="760" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="675" cy="72" r="84" fill="none" stroke="#9bad92" stroke-opacity=".35"/>
