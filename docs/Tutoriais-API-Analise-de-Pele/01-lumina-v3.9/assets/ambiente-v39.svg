    <rect x="75" y="111" width="145" height="286" rx="8" fill="#182838"/>
    <text x="91" y="136" fill="#8ea0ae" font-family="Consolas,monospace" font-size="10">EXPLORER</text>
    <g fill="#dce5ea" font-family="Consolas,monospace" font-size="11">
      <text x="91" y="166">▾ admin</text><text x="91" y="192">▾ frontend</text><text x="91" y="218">▾ routers</text><text x="91" y="244">  main.py</text><text x="91" y="270">  .env</text><text x="91" y="296">  README.md</text>
    </g>
    <g transform="translate(237 111)">
