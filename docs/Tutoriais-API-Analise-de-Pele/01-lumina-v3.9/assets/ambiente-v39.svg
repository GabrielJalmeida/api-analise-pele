      <text x="16" y="48" fill="#e5edf1" font-family="Consolas,monospace" font-size="10">uvicorn main:app --reload</text>
      <text x="16" y="67" fill="#94c89a" font-family="Consolas,monospace" font-size="9">Uvicorn running on http://127.0.0.1:8000</text>
    </g>
    <g transform="translate(237 211)">
      <rect width="323" height="82" rx="8" fill="#0c1723" stroke="#31465a"/>
      <circle cx="17" cy="17" r="5" fill="#b99066"/><text x="30" y="21" fill="#94a7b5" font-family="Segoe UI,Arial" font-size="10">FRONTEND</text>
      <text x="16" y="48" fill="#e5edf1" font-family="Consolas,monospace" font-size="10">npm run dev</text>
      <text x="16" y="67" fill="#94c89a" font-family="Consolas,monospace" font-size="9">Local: http://localhost:5173/</text>
    </g>
    <g transform="translate(237 311)">
      <rect width="323" height="82" rx="8" fill="#0c1723" stroke="#31465a"/>
      <circle cx="17" cy="17" r="5" fill="#7596a9"/><text x="30" y="21" fill="#94a7b5" font-family="Segoe UI,Arial" font-size="10">PAINEL</text>
      <text x="16" y="48" fill="#e5edf1" font-family="Consolas,monospace" font-size="10">npm run dev</text>
      <text x="16" y="67" fill="#94c89a" font-family="Consolas,monospace" font-size="9">Local: http://localhost:5174/</text>
    </g>
