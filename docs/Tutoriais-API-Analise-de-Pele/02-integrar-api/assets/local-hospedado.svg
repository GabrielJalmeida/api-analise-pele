<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">Comparação entre API local e hospedada</title>
  <desc id="desc">Na opção local tudo funciona no mesmo computador; na hospedada o site e a API são acessados pela internet.</desc>
  <rect width="880" height="340" rx="28" fill="#edf2f2"/>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(36 35)"><rect width="378" height="270" rx="24" fill="#fffdf9" stroke="#d4dddd"/><text x="28" y="38" fill="#365f73" font-size="11" letter-spacing="2">MODO LOCAL</text><rect x="89" y="68" width="200" height="125" rx="14" fill="#102033"/><rect x="104" y="83" width="170" height="82" rx="7" fill="#eff2ee"/><rect x="146" y="199" width="116" height="12" rx="6" fill="#667987"/><text x="189" y="118" text-anchor="middle" fill="#102033" font-size="12">Site + API</text><text x="189" y="143" text-anchor="middle" fill="#61716b" font-size="10">127.0.0.1</text><path d="M45 236h288" stroke="#8aa0aa" stroke-width="2" stroke-dasharray="6 6"/><text x="189" y="258" text-anchor="middle" fill="#67736f" font-size="11">Só funciona enquanto este PC está ligado</text></g>
    <g transform="translate(466 35)"><rect width="378" height="270" rx="24" fill="#fffdf9" stroke="#d4dddd"/><text x="28" y="38" fill="#9a6e4e" font-size="11" letter-spacing="2">MODO HOSPEDADO</text><circle cx="89" cy="126" r="45" fill="#e3ecef"/><path d="M51 126h76M89 83c22 24 22 62 0 86M89 83c-22 24-22 62 0 86M48 111h82M48 141h82" fill="none" stroke="#5c8294" stroke-width="2"/><rect x="190" y="77" width="143" height="54" rx="14" fill="#102033"/><text x="261" y="99" text-anchor="middle" fill="#9fb7c3" font-size="9">FRONTEND</text><text x="261" y="118" text-anchor="middle" fill="#fff" font-size="10">https://meusite.com</text><rect x="190" y="151" width="143" height="54" rx="14" fill="#6e8792"/><text x="261" y="173" text-anchor="middle" fill="#dce8ec" font-size="9">API</text><text x="261" y="192" text-anchor="middle" fill="#fff" font-size="10">https://api.meusite.com</text><path d="M134 126h51" stroke="#8a9ba0" stroke-width="2"/><text x="189" y="258" text-anchor="middle" fill="#67736f" font-size="11">Disponível sem depender do seu computador</text></g>
  </g>
</svg>
